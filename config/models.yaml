version: 1

# Mapeo capability_tier -> modelo concreto. Ver talos-0.0.6.md seccion 20.3.
#
# El nucleo NO conoce identificadores de modelo: solo tiers. Este archivo es
# el unico lugar donde un tier se convierte en un modelo, igual que
# config/extensions.yaml es el unico donde una capacidad se convierte en un
# adapter. Cambiar de proveedor se hace aca y en ningun otro lado.
#
# El tier lo elige el plan por el RIESGO de la feature, no por el precio. El
# presupuesto puede frenar la ejecucion, nunca bajar el tier (reglas 33.7 y
# 33.8).

# PILOTO: el trabajo mecanico es barato, la coordinacion no.
#
# fast y balanced comparten modelo a proposito. Mientras se prueba el sistema,
# lo que se ejercita es el mecanismo -despacho, alcance, evidencia, gates- y no
# la calidad del razonamiento de quien implementa una tarea acotada. Pagar
# tokens caros para comprobar que un gate rechaza sin evidencia es gastar en la
# parte que no se esta probando.
#
# deep NO se abarata. Es el piso de los roles que coordinan (seccion 20.4) y el
# tier que el plan pide cuando el riesgo es alto: ahi el error no cuesta una
# tarea, cuesta la feature entera. La regla 20.5.7 es explicita en que el
# routing NO DEBE consultar costo.
tiers:
  # Trabajo mecanico y acotado: el riesgo bajo no justifica gastar mas.
  fast:
    model: minimax-coding-plan/MiniMax-M3
    provider: opencode
    cost_per_mtok_input: 0.30
    cost_per_mtok_output: 1.20

  # El caso normal.
  balanced:
    model: minimax-coding-plan/MiniMax-M3
    provider: opencode
    cost_per_mtok_input: 0.30
    cost_per_mtok_output: 1.20

  # Riesgo alto o critico, y piso de los roles que coordinan. El plan pide deep
  # cuando equivocarse sale caro; ahi es donde el gasto se justifica, porque el
  # error no cuesta una tarea sino la feature entera.
  deep:
    model: claude-opus-5
    provider: claude
    cost_per_mtok_input: 15.00
    cost_per_mtok_output: 75.00
