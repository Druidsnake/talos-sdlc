version: 1

# Mapeo capability_tier -> modelo concreto. Ver talos-0.0.6.md seccion 20.3.
#
# El nucleo NO conoce identificadores de modelo: solo tiers. Este archivo es
# el unico lugar donde un tier se convierte en un modelo, igual que
# config/extensions.yaml es el unico donde una capacidad se convierte en un
# adapter. Cambiar de proveedor se hace aca y en ningun otro lado.
#
# El tier lo elige el plan por el RIESGO de la feature, no por el precio. El
# presupuesto puede frenar la ejecucion, nunca bajar el tier (reglas 33.7 y
# 33.8).

# PILOTO: los tres tiers apuntan al mismo modelo a proposito.
#
# Es una decision de OPERACION, no de diseño. Mientras se prueba el sistema,
# lo que se ejercita es el mecanismo -despacho, alcance, evidencia, gates- y no
# la calidad del razonamiento del agente. Pagar tokens de un modelo caro para
# comprobar que un gate rechaza sin evidencia es gastar en la parte que no se
# esta probando.
#
# EL PRECIO DE ESTO, EXPLICITO: un feature de riesgo critical pide tier deep
# porque equivocarse sale caro (seccion 20.1), y hoy deep no es mas capaz que
# fast. La regla 33.7 sigue valiendo -el presupuesto nunca degrada el tier-,
# pero aca el tier ya viene degradado desde la configuracion. Antes de correr
# trabajo real de riesgo alto, esta tabla vuelve a tener tres modelos distintos.
tiers:
  # Trabajo mecanico y acotado: el riesgo bajo no justifica gastar mas.
  fast:
    model: minimax-coding-plan/MiniMax-M3
    provider: opencode
    cost_per_mtok_input: 0.30
    cost_per_mtok_output: 1.20

  # El caso normal.
  balanced:
    model: minimax-coding-plan/MiniMax-M3
    provider: opencode
    cost_per_mtok_input: 0.30
    cost_per_mtok_output: 1.20

  # Riesgo alto o critico. El plan pide deep cuando equivocarse sale caro.
  deep:
    model: minimax-coding-plan/MiniMax-M3
    provider: opencode
    cost_per_mtok_input: 0.30
    cost_per_mtok_output: 1.20
