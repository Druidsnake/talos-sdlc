name: talos

# Mecanismo 3 de system/00-enforcement.md: check de CI.
#
# A diferencia de los git hooks, esto corre del otro lado y no se saltea
# con --no-verify. Es la barrera real, no la de conveniencia.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar validador
        run: python -m pip install --quiet jsonschema pyyaml

      - name: verificaciones de Talos
        run: tools/check-all.sh

  drift:
    name: generados al dia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar pyyaml
        run: python -m pip install --quiet pyyaml

      - name: regenerar y comparar
        run: |
          python tools/build-rules.py
          if ! git diff --exit-code --stat; then
            echo ""
            echo "::error::hooks/generated/ no coincide con config/roles.yaml"
            echo "Ejecuta: python tools/build-rules.py y commitea el resultado"
            exit 1
          fi

  shell:
    name: sintaxis de shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: verificar POSIX sh
        run: |
          status=0
          for f in $(find hooks tools tests -name '*.sh') hooks/git/commit-msg hooks/git/pre-commit; do
            if sh -n "$f"; then
              echo "ok   $f"
            else
              echo "FALLA $f"
              status=1
            fi
          done
          exit $status

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --shell=sh --severity=warning \
            hooks/*.sh hooks/lib/*.sh tools/*.sh tests/*.sh \
            hooks/git/commit-msg hooks/git/pre-commit
